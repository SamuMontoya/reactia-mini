<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Reactia Mini — Ad 1:1</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=DM+Sans:opsz,wght@9..40,400..700&display=swap"
  rel="stylesheet"
/>
<style>
  :root {
    --color-ink: #111010;
    --color-white: #fdfcfa;
    --color-amber: #c8860a;
    --color-amber-intense: #e0980c;
    --color-yellow-glow: #ffde59;
    --color-amber-dim: #a06d08;
    --color-dust: #c8c2b8;
    --color-stone: #7a7570;
    --font-display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
    --font-body: "DM Sans", "Helvetica Neue", Arial, sans-serif;
    --ease-brand: cubic-bezier(0.22, 1, 0.36, 1);
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    padding: 0;
    background: #06090c;
    font-family: var(--font-body);
  }

  /* Centers the 1080x1080 artboard so it's easy to find/screenshot
     regardless of the actual browser viewport size. */
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .artboard {
    position: relative;
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    background: var(--color-ink);
    isolation: isolate;
  }

  /* ── Background layers, same recipe as the landing page's dark hero ── */

  /* Technical grid, faded toward the edges via a radial mask. */
  .grid-overlay {
    position: absolute;
    inset: 0;
    z-index: 0;
    opacity: 0.13;
    background-image:
      linear-gradient(to right, var(--color-dust) 1px, transparent 1px),
      linear-gradient(to bottom, var(--color-dust) 1px, transparent 1px);
    background-size: 54px 54px;
    /* Wider, more centred than the site's own hero mask: on a square 1:1
       crop the original ellipse fell off hard well before the left edge,
       leaving that whole column as flat black instead of textured dark. */
    -webkit-mask-image: radial-gradient(ellipse 105% 100% at 50% 45%, #000 50%, transparent 95%);
    mask-image: radial-gradient(ellipse 105% 100% at 50% 45%, #000 50%, transparent 95%);
  }

  /* Fine diagonal hatch + two soft ambient washes. */
  .textura {
    position: absolute;
    inset: 0;
    z-index: 0;
    background-image:
      repeating-linear-gradient(
        45deg,
        rgba(200, 134, 10, 0.05) 0,
        rgba(200, 134, 10, 0.05) 1px,
        transparent 1px,
        transparent 26px
      ),
      radial-gradient(ellipse 60% 45% at 15% 0%, rgba(200, 134, 10, 0.08) 0%, transparent 70%),
      radial-gradient(ellipse 55% 40% at 90% 100%, rgba(122, 117, 112, 0.07) 0%, transparent 70%),
      /* Counterweight for the bottom-left, which was falling to flat black
         while the right side carried both the IA mark and the circuitry. */
      radial-gradient(ellipse 50% 45% at 5% 85%, rgba(200, 134, 10, 0.06) 0%, transparent 72%);
  }

  /* Grain, via an inline fractal-noise filter (no external file to load). */
  .grain {
    position: absolute;
    inset: 0;
    z-index: 0;
    opacity: 0.05;
  }

  /* The drifting amber halo behind the headline. */
  .halo {
    position: absolute;
    left: 50%;
    top: -260px;
    z-index: 0;
    width: 760px;
    height: 760px;
    border-radius: 9999px;
    transform: translateX(-50%);
    background: radial-gradient(
      circle,
      rgba(200, 134, 10, 0.24) 0%,
      rgba(200, 134, 10, 0.06) 45%,
      transparent 72%
    );
  }

  /* Amber hairline seam along the very bottom edge. */
  .seam {
    position: absolute;
    inset-inline: 0;
    bottom: 0;
    z-index: 1;
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(200, 134, 10, 0.55), transparent);
  }

  /* Giant "IA" watermark, bleeding off the right edge — the same oversized
     ghost-glyph-in-the-corner motif the product already uses elsewhere
     (the review screen's giant quotation mark), reused here so "IA" reads
     as the technology under everything rather than one more word in the
     sentence. */
  .ia-watermark {
    position: absolute;
    top: 50%;
    right: -80px;
    z-index: 0;
    transform: translateY(-50%);
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 760px;
    line-height: 1;
    letter-spacing: -0.04em;
    color: var(--color-amber);
    opacity: 0.16;
    white-space: nowrap;
  }

  /* ── Content ── */

  .content {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 72px 76px 64px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 22px;
  }

  .brand svg {
    width: 84px;
    height: auto;
  }

  .brand span {
    font-family: var(--font-display);
    font-size: 52px;
    font-weight: 700;
    color: var(--color-white);
    letter-spacing: -0.01em;
  }

  .middle {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    margin-top: 8px;
  }

  .headline {
    font-family: var(--font-display);
    font-weight: 800;
    color: var(--color-white);
    font-size: 68px;
    line-height: 1.12;
    letter-spacing: -0.015em;
    margin: 0;
  }

  .headline span {
    display: block;
  }

  /* "estrategia y tecnología" gets the same gradient-fill-text treatment as
     "Tu diagnóstico" on the results page (bg-gradient + bg-clip-text), just
     re-based for a dark background: light → amber instead of ink → amber. */
  .headline .accent {
    background: linear-gradient(to bottom right, var(--color-white) 35%, var(--color-amber-intense) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  /* ── CTA block: icon, then its two lines, then GRATIS — all one
     centered column, per the sketch. ── */
  .cta-block {
    margin-top: 72px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .tap-icon {
    flex: none;
    width: 76px;
    height: 76px;
    border-radius: 9999px;
    background: rgba(200, 134, 10, 0.14);
    border: 1.5px solid rgba(200, 134, 10, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .tap-icon svg {
    width: 38px;
    height: 38px;
  }

  .cta-block p.cta-text {
    margin: 18px 0 0;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 32px;
    line-height: 1.35;
    color: var(--color-dust);
    letter-spacing: -0.005em;
  }

  .gratis {
    margin-top: 30px;
    position: relative;
    display: inline-block;
    width: fit-content;
  }

  .gratis .glow {
    position: absolute;
    inset: 0;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 132px;
    text-transform: uppercase;
    letter-spacing: -0.02em;
    color: var(--color-yellow-glow);
    opacity: 0.9;
    filter: blur(30px);
  }

  .gratis .solid {
    position: relative;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 132px;
    text-transform: uppercase;
    letter-spacing: -0.02em;
    color: var(--color-amber-intense);
  }

  .footnote {
    margin-top: 10px;
    font-family: var(--font-body);
    font-size: 22px;
    color: var(--color-stone);
  }

  /* ── Extra "tech" detailing: corner HUD brackets, a small mono tag, and a
     faint circuit of nodes — all thin-line and low-opacity so the frame
     stays sober instead of busy. ── */

  .corner {
    position: absolute;
    z-index: 1;
    width: 44px;
    height: 44px;
    border-color: rgba(200, 134, 10, 0.55);
    border-style: solid;
    border-width: 0;
  }
  .corner--tr {
    top: 40px;
    right: 40px;
    border-top-width: 2px;
    border-right-width: 2px;
  }
  .corner--bl {
    bottom: 40px;
    left: 40px;
    border-bottom-width: 2px;
    border-left-width: 2px;
  }
  .corner--br {
    bottom: 40px;
    right: 40px;
    border-bottom-width: 2px;
    border-right-width: 2px;
  }

  .circuit {
    position: absolute;
    inset: 0;
    z-index: 0;
    opacity: 0.5;
  }
</style>
</head>
<body>

    <div class="grid-overlay"></div>
    <div class="textura"></div>

    <svg class="grain" xmlns="http://www.w3.org/2000/svg">
      <filter id="grainFilter">

    <div class="halo"></div>
    <div class="ia-watermark" aria-hidden="true">IA</div>

    <svg class="circuit" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

           part of the load — two runs instead of three, so that side reads

        <circle cx="972" cy="972" r="3.5" opacity="0.3" />
      </g>

        <circle cx="1026" cy="162" r="3.5" opacity="0.32" />
        <circle cx="918" cy="108" r="3.5" opacity="0.32" />
      </g>

      <!-- Left column. The whole left edge was reading as flat black next to
           a busy right side; this is the counterweight, on the same 54px
           grid, kept below the headline so it never crowds the type. -->
      <g fill="none" stroke="#C8860A" stroke-width="1.5" stroke-linecap="round">
        <path d="M162 810 L108 810 L108 702 L54 702" opacity="0.4" />
        <path d="M108 810 L108 918 L216 918" opacity="0.28" />

      </g>
      <g fill="#C8860A">
        <circle cx="162" cy="810" r="4.5" opacity="0.55" />
        <circle cx="108" cy="810" r="4" opacity="0.45" />
        <circle cx="54" cy="702" r="3.5" opacity="0.32" />
        <circle cx="216" cy="918" r="3.5" opacity="0.3" />
        <circle cx="162" cy="756" r="3" opacity="0.3" />
      </g>

      <!-- A couple of lone nodes higher up the left edge, filling the gap
           left by the removed top-left corner bracket without putting a
           hard graphic back in that spot. -->
      <g fill="#C8860A">
        <circle cx="108" cy="378" r="3.5" opacity="0.3" />
        <circle cx="54" cy="486" r="3" opacity="0.22" />
      </g>
      <g fill="none" stroke="#C8860A" stroke-width="1.5" stroke-linecap="round">
        <path d="M108 378 L108 324" opacity="0.22" />
      </g>
    </svg>

    <div class="corner corner--tr"></div>
    <div class="corner corner--bl"></div>
    <div class="corner corner--br"></div>

    <div class="seam"></div>
